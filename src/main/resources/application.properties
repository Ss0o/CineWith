spring.application.name=community-service
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.security.oauth2.redirect.member=${FRONTEND_MEMBER_REDIRECT_URI:http://localhost:5173/}
app.security.oauth2.redirect.signup-required=${FRONTEND_SIGNUP_REDIRECT_URI:http://localhost:5173/signup}

tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org}
tmdb.access-token=${TMDB_ACCESS_TOKEN}
tmdb.language=${TMDB_LANGUAGE:}
tmdb.region=${TMDB_REGION:}
tmdb.connect-timeout=${TMDB_CONNECT_TIMEOUT:2s}
tmdb.read-timeout=${TMDB_READ_TIMEOUT:5s}
